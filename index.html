<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0a0a12" />
        <link rel="canonical" href="%VITE_SITE_URL%/" />
        <meta
            name="robots"
            content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
        />

        <title>NeuraTiM Checklist — Free, Private, Ad-Free Checklists</title>
        <meta
            name="description"
            content="NeuraTiM Checklist — a free, ad-free packing and reminder checklist app for iOS, Android, and the web. No account, no tracking, everything stays on your device."
        />

        <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
        <link rel="apple-touch-icon" sizes="512x512" href="/favicon-512.png" />

        <!-- Robots and social crawlers read these tags without running any script. -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="%VITE_SITE_URL%/" />
        <meta property="og:site_name" content="NeuraTiM Checklist" />
        <meta property="og:title" content="NeuraTiM Checklist — Free, Private, Ad-Free Checklists" />
        <meta
            property="og:description"
            content="Free packing and reminder checklists for iOS, Android, and the web. No account, no ads, no tracking — everything stays on your device."
        />
        <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="NeuraTiM Checklist — Free, Private, Ad-Free Checklists" />
        <meta
            name="twitter:description"
            content="Free packing and reminder checklists for iOS, Android, and the web. No account, no ads, no tracking."
        />
        <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "SoftwareApplication",
                "name": "NeuraTiM Checklist",
                "alternateName": "Checklist",
                "url": "%VITE_SITE_URL%/",
                "description": "A free, offline packing and reminder checklist app for iOS, Android and the web: reusable templates, conditional items, smart reminders, encrypted backups, and a home-screen widget. No account, no ads, no tracking — everything stays on the device.",
                "applicationCategory": "ProductivityApplication",
                "operatingSystem": "Web, iOS, Android",
                "image": "%VITE_SITE_URL%/app-icon.png",
                "inLanguage": [
                    "ar",
                    "bn",
                    "cs",
                    "de",
                    "en",
                    "es",
                    "fr",
                    "hi",
                    "id",
                    "it",
                    "ja",
                    "ko",
                    "pl",
                    "pt",
                    "ru",
                    "tr",
                    "vi",
                    "zh"
                ],
                "offers": {
                    "@type": "Offer",
                    "price": "0",
                    "priceCurrency": "USD"
                },
                "publisher": {
                    "@type": "Organization",
                    "name": "NeuraTiM",
                    "url": "https://neuratim.com/"
                }
            }
        </script>
    </head>
    <body>
        <!-- Filled with the actual styled page at build time; React replaces it on mount. -->
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
